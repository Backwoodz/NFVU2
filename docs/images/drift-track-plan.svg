<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc">
<title id="title">NFVU2 Driftstrecke: U-Prototyp im Massstab</title>
<desc id="desc">108 Meter Anfahrt, 180 Grad Kehre mit 38 Meter Mittellinienradius, 108 Meter Rueckgerade. 16 bis 20 Meter Fahrbahnbreite. Weltstart westlich bei X null und Z null. Norden zeigt nach oben.</desc>
